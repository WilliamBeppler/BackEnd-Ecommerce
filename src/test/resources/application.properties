

spring.datasource.url=jdbc:h2:mem:loja_teste;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Chave de teste (HS256 exige pelo menos 32 bytes)
jwt.secret=chave-de-teste-com-mais-de-32-caracteres-123456
jwt.expiration=7200000

# Loja e painel em origens diferentes, como no desenvolvimento
app.cors.allowed-origins=http://localhost:5500,http://localhost:5501
app.admin.allowed-origins=http://localhost:5501

app.cookie.secure=false
app.login.max-falhas-por-email=5
app.login.max-falhas-por-ip=20
app.login.janela-minutos=15


app.mercadopago.access-token=TEST-token-falso-so-para-testes
app.mercadopago.webhook-secret=segredo-falso-do-webhook
app.mercadopago.api-url=http://localhost:9
app.loja.url=http://localhost:5500
