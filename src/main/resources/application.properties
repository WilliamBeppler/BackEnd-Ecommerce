#Configurações de Conexão com o Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/loja_william?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

#Configurações do Hibernate

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

jwt.expiration=7200000

app.cors.allowed-origins=${CORS_ORIGINS}

app.admin.allowed-origins=${ADMIN_ORIGINS}

#Cookie do token: Secure (so HTTPS) desligado em dev, ligado em producao

app.cookie.secure=${COOKIE_SECURE}
app.login.max-falhas-por-email=5
app.login.max-falhas-por-ip=20
app.login.janela-minutos=15

#Mercado Pago (Aulas de pagamento). O token e SEGREDO: vem do .env (MP_ACCESS_TOKEN).

app.mercadopago.access-token=${MP_ACCESS_TOKEN}
app.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET}
app.mercadopago.api-url=https://api.mercadopago.com
app.loja.url=${LOJA_URL}

spring.config.import=optional:file:.env[.properties]
