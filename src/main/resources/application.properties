# 1. Configurações de Conexão com o Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/loja_william?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# 2. Configurações do Hibernate
# 'update' faz o Spring olhar para as suas tabelas sem apagar o que você já fez lá no MySQL
spring.jpa.hibernate.ddl-auto=update

# 3. Para vermos o Spring trabalhando nos bastidores
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
# Validade do token em milissegundos. 7200000 = 2 horas.
jwt.expiration=7200000

# 4. CORS: origens do front-end que podem chamar a API (lista separada por virgula)
app.cors.allowed-origins=${CORS_ORIGINS}

# 4b. Origens do PAINEL de admin: unicas que podem criar/editar/desativar produtos
#     (cada uma tambem precisa estar em CORS_ORIGINS)
app.admin.allowed-origins=${ADMIN_ORIGINS}

# 5. Cookie do token: Secure (so HTTPS) desligado em dev, ligado em producao
app.cookie.secure=${COOKIE_SECURE}

# 5b. Limite de tentativas de login que falharam
app.login.max-falhas-por-email=5
app.login.max-falhas-por-ip=20
app.login.janela-minutos=15

# 6. Segredos e ambiente: DB_PASSWORD, JWT_SECRET, CORS_ORIGINS, ADMIN_ORIGINS e COOKIE_SECURE vem de variaveis de ambiente.
spring.config.import=optional:file:.env[.properties]
